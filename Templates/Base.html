<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}AutoIncome{% endblock %}</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f7f8fa;
      color: #17202a;
    }
    header {
      display: flex;
      justify-content: space-between;
      padding: 20px 7%;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    header a {
      text-decoration: none;
      color: #111;
    }
    nav a {
      margin-left: 20px;
      color: #555;
    }
    main {
      max-width: 1050px;
      margin: auto;
      padding: 50px 7%;
    }
    .hero {
      max-width: 720px;
      margin-bottom: 45px;
    }
    h1 {
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1;
    }
    .hero p, .large {
      font-size: 20px;
      line-height: 1.6;
      color: #667085;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 22px;
    }
    .card, .product, .success {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px #00000008;
    }
    .card strong {
      display: block;
      font-size: 28px;
      margin: 20px 0;
    }
    .button {
      display: inline-block;
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: #111;
      color: white;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .price {
      font-size: 48px;
      font-weight: 800;
      margin: 25px 0;
    }
    .pill {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #667085;
    }
    .muted {
      color: #8a94a6;
      font-size: 14px;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #8a94a6;
    }
  </style>
</head>
<body>
<header>
  <a href="/"><strong>AutoIncome</strong></a>
  <nav>
    <a href="/">Store</a>
    <a href="/admin">Admin</a>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  Automated digital-product storefront
</footer>
</body>
</html>
